<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roblox AI Game Studio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#09090f;--b2:#111119;--b3:#17171f;--bd:#252535;--bd2:#353550;--tx:#eaeaf5;--t2:#9090b0;--t3:#6a6a85;--ac:#7c6af5;--gr:#22d3a0;--am:#f5a623;--rd:#f04060;--bl:#4a9eff;--f:'Space Grotesk',sans-serif;--m:'JetBrains Mono',monospace}
html{background:var(--bg);color:var(--tx);font:14px/1.6 var(--f)}
.px{width:22px;height:22px;image-rendering:pixelated;flex-shrink:0;animation:bob 2s steps(4,end) infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes pl{50%{opacity:.5}}
.nav{display:flex;align-items:center;gap:6px;background:var(--b2);border-bottom:1px solid var(--bd);padding:0 1.2rem;position:sticky;top:0;z-index:50}
.logo{font-weight:700;display:flex;gap:8px;align-items:center;padding:.8rem 1rem .8rem 0;margin-right:.5rem;border-right:1px solid var(--bd)}
.nt{padding:.85rem 1rem;color:var(--t3);cursor:pointer;border-bottom:2px solid transparent;font-weight:500}.nt.on{color:var(--ac);border-color:var(--ac)}
.ai{margin-left:auto;font-size:.75rem;background:var(--b3);border:1px solid var(--bd);border-radius:8px;padding:.35rem .7rem;display:flex;gap:6px;align-items:center}.ai i{width:7px;height:7px;border-radius:50%;background:var(--gr)}
.wrap{display:grid;grid-template-columns:1fr 310px;gap:1.2rem;max-width:1280px;margin:0 auto;padding:1.4rem 1.2rem 4rem}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.page{display:none}.page.on{display:block}
h1{font-size:1.5rem}.sub{color:var(--t2);margin-bottom:1rem}
.card{background:var(--b2);border:1px solid var(--bd);border-radius:14px;padding:1rem;margin-bottom:.9rem}
.row{display:flex;gap:8px;flex-wrap:wrap}
input,textarea{background:var(--b3);border:1px solid var(--bd2);border-radius:9px;padding:9px 12px;color:var(--tx);font:inherit;outline:none}input:focus,textarea:focus{border-color:var(--ac)}
.btn{border:0;border-radius:9px;padding:9px 16px;font:600 .85rem var(--f);cursor:pointer;background:var(--ac);color:#fff}.btn:disabled{opacity:.4;cursor:not-allowed}.btn.gr{background:var(--gr);color:#000}.btn.rd{background:var(--rd)}.btn.ol{background:0;border:1px solid var(--bd2);color:var(--tx)}.btn.sm{padding:5px 11px;font-size:.76rem}
.err{background:rgba(240,64,96,.1);border:1px solid rgba(240,64,96,.35);color:var(--rd);border-radius:9px;padding:9px 13px;margin-bottom:.8rem;font-size:.82rem}
.mut{color:var(--t3);font-size:.82rem}
.gtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:.9rem}.gt{display:flex;gap:7px;align-items:center;padding:7px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--b2);cursor:pointer;font-size:.82rem}.gt.on{border-color:var(--ac);background:rgba(124,106,245,.12)}
.flow{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-bottom:.9rem}
.fs{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:9px;font-size:.73rem;cursor:pointer;color:#1a1a24;font-weight:600;opacity:.5;border:2px solid transparent}.fs.run{opacity:1;animation:pl 1.4s infinite}.fs.done{opacity:1}.fs.wait{opacity:1;border-color:#fff}.fs.err{opacity:1;border-color:var(--rd)}.ar{color:var(--t3)}
.stabs{display:flex;gap:4px;margin-bottom:.8rem;border-bottom:1px solid var(--bd)}.st{padding:8px 14px;cursor:pointer;color:var(--t3);border-bottom:2px solid transparent;font-weight:500}.st.on{color:var(--ac);border-color:var(--ac)}
.stg{border:1px solid var(--bd);border-radius:13px;margin-bottom:.7rem;overflow:hidden;background:var(--b2)}.stg.err{border-color:var(--rd)}
.sh{display:flex;align-items:center;gap:10px;padding:11px 15px;cursor:pointer;color:#1a1a24}.sh b{flex:1}.sh em{font-style:normal;font-size:.7rem}
.bd{font-size:.64rem;font-weight:700;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:rgba(0,0,0,.1);border:1px solid rgba(0,0,0,.25)}
.sb{display:none;padding:4px 15px 15px}.sb.o{display:block}
.role{color:var(--t2);font-size:.82rem;margin:.7rem 0}.lbl{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--t3);margin:.7rem 0 5px}
.bots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.bc{background:var(--b3);border:1px solid var(--bd);border-radius:9px;padding:7px 10px;font-size:.74rem;position:relative}.bc i{position:absolute;right:9px;top:11px;width:7px;height:7px;border-radius:50%;background:var(--bd2)}
.bc.work{border-color:var(--ac)}.bc.work i{background:var(--ac);animation:pl 1s infinite}.bc.done i{background:var(--gr)}.bc.err i{background:var(--rd)}.bc b{display:block}.bc span{color:var(--t2)}
pre.out,pre.code{background:var(--b3);border:1px solid var(--bd);border-radius:9px;padding:10px;font:.72rem/1.7 var(--m);color:var(--t2);white-space:pre-wrap;max-height:260px;overflow:auto}pre.code{max-height:380px;background:var(--bg)}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:.7rem}
.idc{background:var(--b3);border:1px solid var(--bd);border-radius:11px;padding:11px;font-size:.78rem;color:var(--t2);display:flex;flex-direction:column;gap:6px}.idc b{color:var(--tx);font-size:.86rem}.idc.sel{border-color:#e6b422;box-shadow:0 0 0 1px #e6b422}.idc p{flex:1}
.myq{width:100%;min-height:60px}
.qa{border:1px solid var(--bd);border-radius:9px;padding:8px 10px;margin-top:6px;background:var(--b3);font-size:.78rem}.qa b{display:block;color:var(--tx)}.qa span{color:var(--t2)}
.vd{border:1px solid var(--bd2);border-left:4px solid var(--gr);border-radius:10px;padding:10px 13px;margin-top:.8rem;background:var(--b3)}.vd.FIX{border-left-color:var(--am)}.vd .h{font-weight:700;margin-bottom:6px}.vd.APPROVE .h{color:var(--gr)}.vd.FIX .h{color:var(--am)}
.vd .c{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;font-size:.78rem;color:var(--t2)}.vd h5{font-size:.66rem;text-transform:uppercase;color:var(--t3)}.vd ul{margin-left:1rem}
.sc{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-top:.7rem}.sk{background:var(--b3);border:2px solid var(--bd);border-radius:10px;padding:10px;font-size:.76rem;color:var(--t2);cursor:pointer}.sk.sel{border-color:var(--ac)}.sk b{font-size:1.3rem}.sk b.g{color:var(--gr)}.sk b.a{color:var(--am)}.sk b.r{color:var(--rd)}.sk h6{color:var(--tx);font-size:.78rem}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:.8rem}
.cmp{width:100%;border-collapse:collapse;font-size:.8rem;margin-top:.5rem}.cmp td,.cmp th{border-bottom:1px solid var(--bd);padding:5px 8px;text-align:left}.up{color:var(--gr)}.dn{color:var(--rd)}
.sketch{width:100%;max-width:640px;border:1px solid var(--bd2);border-radius:10px;background:#1b1b26;margin-top:6px}
.file{margin-bottom:1rem}.crumb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font:.76rem var(--m);margin-bottom:6px;color:var(--bl)}.crumb em{color:var(--t3);font-style:normal}
.chip{font:600 .66rem var(--f);padding:2px 8px;border-radius:20px;background:rgba(124,106,245,.15);color:var(--ac)}.chip.ok{background:rgba(34,211,160,.15);color:var(--gr)}.chip.bad{background:rgba(240,64,96,.15);color:var(--rd)}.chip.w{background:rgba(245,166,35,.15);color:var(--am)}
.part{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--bd);border-radius:10px;margin-bottom:6px;background:var(--b3)}.part b{min-width:170px}.part span{flex:1;color:var(--t2);font-size:.78rem}
.upg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:.7rem}.upg div{background:var(--b3);border:1px solid var(--bd);border-radius:10px;padding:10px;font-size:.76rem;color:var(--t2)}.upg b{color:var(--tx);display:block}
aside .card{position:sticky;top:64px}.step{display:flex;gap:8px;align-items:center;font-size:.78rem;color:var(--t3);padding:3px 0}.step.run{color:var(--ac)}.step.done{color:var(--gr)}.step.err{color:var(--rd)}.step i{width:7px;height:7px;border-radius:50%;background:currentColor}
</style></head><body>
<div class="nav"><div class="logo" id="logo"></div><div class="nt on" onclick="pg('studio',this)">Game Studio</div><div class="ai"><i id="aid"></i><span id="ail">Checking AI...</span></div></div>
<div class="wrap"><main>
<div class="page on" id="p-studio">
 <h1>Game Studio</h1><div class="sub">5 ideas, you pick one. Level Bot, Questioner and Betterment sharpen it. Then it is designed, coded, tested, and improved until it scores 8/10.</div>
 <div class="card"><div class="row"><input id="gp" style="flex:1;min-width:200px" value="dodge cannon game" placeholder="Describe a game theme, e.g. zombie survival, obby, tycoon"><button class="btn" onclick="go()">Suggest ideas</button></div></div>
 <div class="gtabs" id="gtabs"></div><div id="gview"></div>
</div>
</div></main>
<aside id="aside"><div class="card"><div class="row" style="align-items:center;margin-bottom:6px" id="hh"></div>
 <div class="mut" style="margin-bottom:8px">Missing a file? The Helper goes Wizard, Designer, Coder, Reviewer, Tester, then adds it to the current game.</div>
 <textarea id="hin" style="width:100%;min-height:70px" placeholder="e.g. add a leaderboard script"></textarea>
 <div class="row" style="margin:8px 0"><button class="btn sm" id="hb" onclick="helper($('hin').value)">Send to Helper</button></div><div id="hlog"></div></div></aside></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const TARGET=8,MAXR=4,QROUNDS=2; // target average rating, max fix rounds, question rounds
const ICONS={
idea:["..aaaa..",".aawwaa.",".aawaaa.",".aaaaaa.","..aaaa..","...dd...","...dd...","..dddd.."],
level:["......aa",".....aaa","....aa..","...aa...","..aa....",".aa.....","aaaaaaaa","dddddddd"],
ask:["..aaaa..",".aa..aa.","....aa..","...aa...","...aa...","........","...aa...","...aa..."],
better:["...aa...","..aaaa..",".aaaaaa.","aaaaaaaa","...aa...","...aa...","...aa...","...aa..."],
design:["......aa",".....aaa","....aaa.","...aaa..","..dda...",".dddd...",".ddd....","..d....."],
code:["........","..a..a..",".a....a.","a..aa..a","a..aa..a",".a....a.","..a..a..","........"],
review:["..aaaa..",".a....a.",".a....a.",".a....a.","..aaaa..","....ddd.",".....ddd","......dd"],
wizard:["...a....","..aa....","..aaa...",".aaaaa..",".aawaa..","aaaaaaaa","dddddddd","........"],
test:["..dddd..","...aa...","...aa...","..aaaa..",".aaaaaa.","aawaaaaa","aaaaaaaa",".aaaaaa."],
fix:["..aa.aa.",".aaaaaa.",".aaaaa..","..aaa...","...dd...","...dd...","..dd....",".dd....."],
ship:["..aaaa..",".aaaaaa.","aaaddaaa","aaaddaaa","aaaddaaa","aaaddaaa",".aaaaaa.",".dddddd."],
help:[".aaaaaa.","aaaaaaaa","aawaawaa","aaaaaaaa",".aaaaaa.","..aa....",".a......","........"]};
function px(n,c){let r="";ICONS[n].forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch===".")return;r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${ch==="a"?c:ch==="w"?"#fff":"#3a3a52"}"/>`}));return `<svg class="px" viewBox="0 0 8 8" shape-rendering="crispEdges" style="animation-delay:-${((n.length*.37+c.length*.11)%2).toFixed(1)}s">${r}</svg>`}
const ST=[
{id:"idea",ic:"idea",bg:"#fff6c2",col:"#b58900",t:"Ideators",role:"Five bots each pitch a different game idea (about 50 words, plain language). You choose one and can add your own questions.",bots:[["ActionBot","Fast action + skill"],["PuzzleBot","Puzzle + strategy"],["CoopBot","Teamwork"],["GrindBot","Progress + collecting"],["PartyBot","Party + rounds"]]},
{id:"level",ic:"level",bg:"#e4f5b0",col:"#6a8f00",t:"Level Bot",role:"Plans levels and the reasons a player comes back to play again and again.",bots:[["Level Bot","Levels + replay hooks"]]},
{id:"ask",ic:"ask",bg:"#ffc2c2",col:"#d33",t:"Questioner",role:"Keeps challenging the idea in rounds: pros, cons and sharp questions. Round 2 asks new follow-ups.",bots:[["Questioner","Pros, cons, questions"]]},
{id:"better",ic:"better",bg:"#e6b422",col:"#7a5c00",t:"Betterment",role:"Answers every question (including yours) from the player's point of view, then rewrites the idea.",bots:[["Betterment","Answers + player-first rewrite"]]},
{id:"design",ic:"design",bg:"#a9d4ff",col:"#2a6fb5",t:"Designers",role:"Decide what to build in Studio and generate a bird's-eye image of the game.",bots:[["MapBot","Parts + layout"],["PlayerBot","Player + rules"],["UIBot","HUD + lighting"],["SketchBot","Bird's-eye image"]]},
{id:"code",ic:"code",bg:"#c9bcff",col:"#5b45d6",t:"Coders",role:"Write one Lua script per system, each with its Studio location.",bots:[["GameManager","Rounds + scoring"],["NPCController","Enemy AI"],["PlayerCtrl","Input + effects"],["GUIScript","HUD + timer"],["MapBuilder","Builds the arena"]]},
{id:"review",ic:"review",bg:"#9cf0d4",col:"#0e8a68",t:"Reviewers",role:"A real Lua parser checks syntax (auto-fixes once), then bots check placement and logic.",bots:[["SyntaxBot","Typos + bad API calls"],["PlacementBot","Server vs client"],["LogicBot","Does the loop work?"]]},
{id:"wiz",ic:"wizard",bg:"#f1b3ff",col:"#a02fc0",t:"Wizard Gate",role:"Explains every file in plain words. Nothing is tested until you approve.",bots:[["Wizard","Plain-language walkthrough"]]},
{id:"test",ic:"test",bg:"#ffc08a",col:"#c4601a",t:"Testers",role:"Five testers score the game. Click a rating, then Redo, if you do not trust it.",bots:[["FunBot","Fun"],["BugBot","Edge cases"],["BalanceBot","Fairness"],["PerfBot","Many players"],["UXBot","UI clarity"]]},
{id:"fix",ic:"fix",bg:"#ffa8b8",col:"#c0304f",t:"Fix Rounds",role:"Repeats until the average reaches 8/10: the Wizard delegates, Coders rewrite only the needed files, Testers re-score. A worse result is reverted.",bots:[["Wizard","Delegates the fixes"],["Coders","Rewrite those files"],["Testers","Re-score"]]},
{id:"ship",ic:"ship",bg:"#b8f0a8",col:"#2d8a1c",t:"Ship + ProBot",role:"Ship it, and let ProBot list what you could add to make the game better.",bots:[["ProBot","Add-on ideas"]]}];
const S=id=>ST.find(s=>s.id===id);
const PARTS=[["Game loop and rounds",/PlayerAdded|round|match/i,"Add a GameManager script: rounds, win/lose, scoring"],["Enemy / NPC bots",/Pathfinding|Humanoid|NPC/i,"Add an NPC controller script for the enemies"],["Player controls",/UserInputService|Activated|Tool/i,"Add a player controller: input and weapon"],["Timer",/timer|countdown|time ?left|os\.clock|tick\(/i,"Add a match timer script with a UI update"],["GUI elements",/ScreenGui|TextLabel|Frame/i,"Add a GUI script: health bar, score and timer"],["Map / arena",/Instance\.new\(["']Part|Terrain|Workspace/i,"Add a MapBuilder script that builds the arena"],["Score / leaderboard",/leaderstats|score/i,"Add a leaderboard / score script"],["Remote events",/RemoteEvent|FireClient|FireServer/i,"Add a Remotes setup script in ReplicatedStorage"]];
const kind=p=>/ModuleScript|Modules/i.test(p)?"ModuleScript":/ServerScriptService|ServerStorage/.test(p)?"Script":"LocalScript";
let GAMES=[],CUR=null;
let HP={st:[["Wizard","idle"],["Designer","idle"],["Coder","idle"],["Reviewer","idle"],["Tester","idle"]],msg:""};
$("logo").innerHTML=px("wizard","#7c6af5")+"Roblox AI Studio";$("hh").innerHTML=px("help","#4a9eff")+"<b>Helper bot</b>";

async function ai(sys,user,max,g){
 if(g&&g.stopped)throw new Error("Stopped");
 let r;try{r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({system:sys,messages:[{role:"user",content:user}],max_tokens:max||1500})})}catch(e){throw new Error("Network error: is your deployment live?")}
 const raw=await r.text();let d;try{d=JSON.parse(raw)}catch(e){throw new Error("Server returned non-JSON (status "+r.status+"). Check Vercel function logs.")}
 if(!r.ok)throw new Error(d.error||"API error "+r.status);
 if(!d.content)throw new Error(d.error||"No content in response.");
 return d.content.map(b=>b.text||"").join("");
}
async function validate(files){try{const r=await fetch("/api/validate-lua",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({files})});const d=await r.json();return r.ok&&d.results?d.results:null}catch(e){return null}}
const lst=(s,n)=>s?s.split(/\n|;/).map(x=>x.replace(/^[\s*\-\d.]+/,"").trim()).filter(x=>x.length>2).slice(0,n||5):[];
function sect(t,k,next){const m=new RegExp(k+":\\s*([\\s\\S]*?)(?="+next+"|$)","i").exec(t);return m?m[1]:""}
const code0=t=>t.replace(/```lua|```/gi,"").trim();
const avg=a=>a.length?(a.reduce((n,x)=>n+x.s,0)/a.length).toFixed(1):"-";
const clone=o=>JSON.parse(JSON.stringify(o));
function pg(id,el){document.querySelectorAll(".page").forEach(p=>p.classList.remove("on"));document.querySelectorAll(".nt").forEach(t=>t.classList.remove("on"));$("p-"+id).classList.add("on");el.classList.add("on");$("aside").style.display=id==="studio"?"":"none"}

function mk(theme){return{id:Date.now()+Math.random(),theme,name:theme.slice(0,18),tab:"pipe",open:{},stopped:false,running:false,err:"",myq:"",...blank()}}
function blank(){return{ideas:[],sel:-1,level:null,pros:[],cons:[],qs:[],cur:[],qa:[],changes:[],final:"",plan:"",design:"",svg:"",svgFail:false,imgSrc:"",imgState:"",files:{},parser:null,fixed:{},scores:[],rounds:[],round:0,best:null,rsel:{},lastFail:"",note:"",v:{},st:{},bot:{},out:{},up:null,shipped:false}}
const setS=(g,id,v)=>{g.st[id]=v;render()};
const bs=(g,s,n,v)=>{g.bot[s+":"+n]=v;render()};
function fan(g,sid,fn){return Promise.all(S(sid).bots.map(async(b,i)=>{bs(g,sid,b[0],"work");try{const r=await fn(b,i);bs(g,sid,b[0],"done");return r}catch(e){bs(g,sid,b[0],"err");throw e}}))}
function fail(g,e){if(e.message!=="Stopped"){g.err=e.message;const r=Object.keys(g.st).find(k=>g.st[k]==="run");if(r)g.st[r]="err"}}
function sel(id){CUR=GAMES.find(g=>g.id==id);render()}
function tg(id){const g=CUR,st=g.st[id]||"idle";g.open[id]=!(g.open[id]!==undefined?g.open[id]:(st==="run"||st==="wait"));render()}
function jump(id){CUR.tab="pipe";CUR.open[id]=true;render();setTimeout(()=>{const e=$("s-"+id);e&&e.scrollIntoView({behavior:"smooth",block:"start"})},50)}
async function go(){const t=$("gp").value.trim();if(!t)return;const g=mk(t);GAMES.push(g);CUR=g;g.running=true;render();try{await s1(g)}catch(e){fail(g,e)}g.running=false;render()}
async function pick(i){const g=CUR;if(g.running)return;Object.assign(g,blank(),{ideas:g.ideas,sel:i});g.st.idea="done";g.stopped=false;g.err="";g.running=true;g.open.level=g.open.ask=g.open.better=true;render();
 try{await sLevel(g);for(let r=1;r<=QROUNDS;r++){await sAsk(g,r);await sBetter(g,r)}await s2(g);await s3(g);await s4(g);await s5(g)}catch(e){fail(g,e)}g.running=false;render()}

async function s1(g){setS(g,"idea","run");const A=["fast action and skill","puzzle and strategy","co-op teamwork","progression and collecting","party and competitive rounds"];
 const res=await fan(g,"idea",(b,i)=>ai("You are a Roblox game ideator. Write ONE game idea in simple language, about 50 words. Reply exactly:\nTITLE: 3-5 words\nIDEA: the idea",`Theme: "${g.theme}". Angle: ${A[i]}. Make it different from other angles.`,220,g));
 g.ideas=res.map((t,i)=>({n:S("idea").bots[i][0],title:(/TITLE:\s*(.+)/i.exec(t)||[])[1]||A[i],text:((/IDEA:\s*([\s\S]+)/i.exec(t)||[])[1]||t).trim()}));g.st.idea="wait";g.open.idea=true;render()}
async function sLevel(g){setS(g,"level","run");bs(g,"level","Level Bot","work");const it=g.ideas[g.sel];
 const t=await ai("You are the Level Bot. Think like a player deciding whether to play this game again tomorrow. Reply exactly:\nLEVELS: level 1 name and twist; level 2; level 3; level 4\nHOOKS: reason to replay; reason; reason; reason\nCOMEBACK: the single strongest reason players return, one sentence","Idea: "+it.title+". "+it.text,450,g);
 g.level={levels:lst(sect(t,"LEVELS","HOOKS")),hooks:lst(sect(t,"HOOKS","COMEBACK")),why:sect(t,"COMEBACK","$^").trim()};
 g.plan=it.title+": "+it.text+"\nLevels: "+g.level.levels.join("; ")+"\nReplay hooks: "+g.level.hooks.join("; ");g.base=g.plan;bs(g,"level","Level Bot","done");setS(g,"level","done")}
async function sAsk(g,r){setS(g,"ask","run");bs(g,"ask","Questioner","work");
 const t=await ai(r===1?"You are the Questioner. Challenge this Roblox game like a skeptical player and developer. Be tough, especially on replayability and levels. Reply exactly:\nPROS: item; item; item\nCONS: item; item; item\nQUESTIONS: 5 or 6 sharp questions separated by ;":"You are the Questioner, round "+r+". Ask 3 NEW follow-up questions about weaknesses that remain in the improved idea. Do not repeat earlier questions. Reply exactly:\nQUESTIONS: question; question; question","Idea:\n"+g.plan+(r>1?"\nAlready asked: "+g.qs.map(x=>x.q).join(" | "):""),480,g);
 if(r===1){g.pros=lst(sect(t,"PROS","CONS"));g.cons=lst(sect(t,"CONS","QUESTIONS"))}
 const qs=lst(sect(t,"QUESTIONS","$^"),8).map(q=>({q,mine:false,r}));

 $("hb").disabled=false;render()}

const cols=(t,a)=>`<div class="vd APPROVE" style="border-left-color:${t}"><div class="c">${a.map(x=>`<div><h5>${x[0]}</h5><ul>${x[1].map(y=>`<li>${esc(y)}</li>`).join("")||"<li>-</li>"}</ul></div>`).join("")}</div></div>`;
const vd=v=>`<div class="vd ${v.rec}"><div class="h">Verdict: ${v.rec==="APPROVE"?"APPROVE":"FIX BEFORE APPROVING"}</div><div class="c"><div><h5>What is good</h5><ul>${v.good.map(x=>`<li>${esc(x)}</li>`).join("")||"<li>-</li>"}</ul></div><div><h5>Watch out</h5><ul>${v.risks.map(x=>`<li>${esc(x)}</li>`).join("")||"<li>nothing major</li>"}</ul></div></div></div>`;
const rtab=r=>`<div class="lbl">Round ${r.n}: average ${r.a0} → ${r.a1} (${r.kept?"kept":"reverted to the better version"}) · critical problems ${r.c0==null?"-":r.c0} → ${r.c1==null?"-":r.c1}</div><table class="cmp"><tr><th>Tester</th><th>Before</th><th>After</th><th>Change</th></tr>${r.now.map((x,i)=>{const p=r.before[i]?r.before[i].s:0,d=x.s-p;return `<tr><td>${x.n}</td><td>${p}/10</td><td>${x.s}/10</td><td class="${d>0?"up":d<0?"dn":""}">${d>0?"+":""}${d}</td></tr>`}).join("")}</table>`;
function stg(g,s){const st=g.st[s.id]||"idle";if(s.id==="fix"&&!g.st.fix)return"";const op=g.open[s.id]!==undefined?g.open[s.id]:(st==="run"||st==="wait"),lab={idle:"Waiting",run:"Working",wait:"Needs you",done:"Done",err:"Error"}[st];
 let b=`<p class="role">${esc(s.role)}</p><div class="bots">${s.bots.map(x=>{const k=g.bot[s.id+":"+x[0]]||"idle";return `<div class="bc ${k}"><i></i><b>${x[0]}</b><span>${esc(x[1])}</span></div>`}).join("")}</div>`;
 if(s.id==="idea"&&g.ideas.length){b+=`<div class="lbl">${st==="wait"?"Choose one idea":"Ideas"}</div><div class="ideas">${g.ideas.map((x,i)=>`<div class="idc ${g.sel===i?"sel":""}"><b>${esc(x.title)}</b><p>${esc(x.text)}</p><button class="btn sm ${g.sel===i?"gr":""}" ${g.running?"disabled":""} onclick="pick(${i})">${g.sel===i?"Chosen":"Choose this idea"}</button></div>`).join("")}</div>`;
  b+=st==="wait"?`<div class="lbl">Your own questions for the Betterment bot (optional, one per line)</div><textarea class="myq" oninput="CUR.myq=this.value" placeholder="e.g. Will it work on mobile? How long is a round?">${esc(g.myq)}</textarea>`:(g.myq.trim()?`<div class="lbl">Your questions</div><pre class="out">${esc(g.myq)}</pre>`:"")}
 if(s.id==="level"&&g.level)b+=cols("#6a8f00",[["Levels",g.level.levels],["Why players come back",g.level.hooks]])+(g.level.why?`<div class="mut" style="margin-top:6px">Strongest hook: ${esc(g.level.why)}</div>`:"");
 if(s.id==="ask"&&g.qs.length)b+=(g.pros.length?cols("#d33",[["Pros",g.pros],["Cons",g.cons]]):"")+`<div class="lbl">Questions asked (${g.qs.length})</div>`+g.qs.map(x=>`<div class="qa"><b>${x.mine?'<span class="chip w">your question</span> ':""}<span class="chip">round ${x.r}</span> ${esc(x.q)}</b></div>`).join("");
 if(s.id==="better"&&g.qa.length){const n=g.qa.filter(x=>!x.a.startsWith("(no answer")).length;b+=`<div class="lbl">Answers (${n} of ${g.qa.length} answered)</div>`+g.qa.map(x=>`<div class="qa"><b>${x.mine?'<span class="chip w">your question</span> ':""}${esc(x.q)}</b><span>${esc(x.a)}</span></div>`).join("");
  if(g.final)b+=`<div class="lbl">Improved idea</div><pre class="out">${esc(g.plan.split("\nLevels:")[0])}</pre>`+cols("#e6b422",[["What changed",g.changes.slice(0,6)]])}
 if(s.id==="design"){if(g.imgState==="ok")b+=`<div class="lbl">Bird's-eye image</div><img class="sketch" alt="Bird's-eye view of the game" src="${esc(g.imgSrc)}">`;
  else if(g.imgState==="load")b+=`<div class="lbl">Bird's-eye image</div><div class="mut">Generating image, this can take up to a minute...</div>`;
  else if(g.imgState==="fail")b+=`<div class="lbl">Bird's-eye layout</div>`+(g.svg?`<img class="sketch" alt="Drawn layout" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(g.svg)}"><div class="mut">The image service did not respond, so this is an AI-drawn layout instead.</div>`:`<div class="mut">${g.svgFail?"No image could be produced. Click Redo image.":"Image service did not respond, drawing a layout..."}</div>`);
  if(g.imgState&&g.imgState!=="load")b+=`<div class="act"><button class="btn ol sm" onclick="startImg(CUR)">Redo image</button></div>`}
 if(g.out[s.id]&&s.id!=="better")b+=`<div class="lbl">Output</div><pre class="out">${esc(g.out[s.id])}</pre>`;
 if(s.id==="test"&&g.scores.length){b+=`<div class="lbl">Ratings and issues (click a rating to select it, then redo)</div><div class="sc">${g.scores.map((x,i)=>`<div class="sk ${g.rsel[i]?"sel":""}" onclick="togSel(${i})"><b class="${x.s>=8?"g":x.s>=5?"a":"r"}">${x.s}/10</b><h6>${x.n}</h6>${esc(x.fb)}</div>`).join("")}</div>`;
  b+=`<div class="act"><button class="btn ol" ${g.running||!Object.values(g.rsel).some(Boolean)?"disabled":""} onclick="redoRatings(false)">Redo selected ratings</button><button class="btn ol" ${g.running?"disabled":""} onclick="redoRatings(true)">Redo all ratings</button></div>`}
 if(s.id==="fix")b+=g.rounds.map(rtab).join("");
 if(g.v[s.id])b+=vd(g.v[s.id]);
 if(s.id==="wiz"&&st==="wait")b+=`<div class="act"><button class="btn gr" onclick="approve()">Approve, run testers</button><button class="btn ol" onclick="jump('idea')">Choose a different idea</button></div>`;
 if(s.id==="test"&&g.scores.length&&!g.shipped){b+=(g.note?`<div class="mut" style="margin-top:8px">${esc(g.note)}</div>`:"")+`<div class="act">${(+avg(g.scores)<TARGET||crit(g)>0)?`<button class="btn" ${g.running?"disabled":""} onclick="keepImproving()">Keep improving to ${TARGET}/10</button>`:""}<button class="btn gr" ${g.running?"disabled":""} onclick="ship()">Ship it (stops all bots)</button></div>`}
 if(s.id==="ship"&&(st==="wait"||st==="done"))b+=(g.shipped?`<div class="vd APPROVE"><div class="h">Shipped. Copy the scripts from the Files tab.</div></div>`:"")+`<div class="act"><button class="btn ol sm" onclick="pro()">${g.up?"Re-run":"Run"} ProBot</button></div>`+(g.up?`<div class="upg">${g.up.map(u=>`<div><b>${esc(u[0])}</b>${esc(u[1])} impact · ${esc(u[2])} effort<br>${esc(u[3])}</div>`).join("")}</div>`:"");
 return `<div class="stg ${st==="err"?"err":""}" id="s-${s.id}"><div class="sh" style="background:${s.bg}" onclick="tg('${s.id}')">${px(s.ic,s.col)}<b>${s.t}</b><span class="bd">${lab}</span><em>${op?"▲":"▼"}</em></div><div class="sb ${op?"o":""}">${b}</div></div>`}
function view(g){
 const flow=ST.filter(s=>s.id!=="fix"||g.st.fix).map((s,i,a)=>`<div class="fs ${g.st[s.id]||""}" style="background:${s.bg}" onclick="jump('${s.id}')">${px(s.ic,s.col)}${s.t}</div>${i<a.length-1?'<span class="ar">→</span>':""}`).join("");
 const n=Object.keys(g.files).length,tabs=[["pipe","Pipeline"],["files","Files ("+n+")"],["anat","Anatomy"]].map(t=>`<div class="st ${g.tab===t[0]?"on":""}" onclick="CUR.tab='${t[0]}';render()">${t[1]}</div>`).join("");
 let body="";
 if(g.tab==="pipe")body=ST.map(s=>stg(g,s)).join("");
 else if(g.tab==="files")body=n?Object.entries(g.files).map(([p,c],i)=>{const r=g.parser&&g.parser[p],badge=r?(r.syntaxOk?(r.warnings&&r.warnings.length?`<span class="chip w">${r.warnings.length} warning(s)</span>`:'<span class="chip ok">parses</span>'):`<span class="chip bad">${esc(r.error)}</span>`):"",fx=g.fixed[p]?'<span class="chip w">auto-fixed</span>':"";
  return `<div class="file"><div class="crumb">${p.split("/").map(esc).join(' <em>→</em> ')} <em>→</em> <span class="chip">${kind(p)}</span>${badge}${fx}</div><pre class="code">${esc(c)}</pre><div class="row" style="margin-top:6px"><button class="btn ol sm" onclick="cp(${i})">Copy</button></div></div>`}).join("")+`<div class="row"><button class="btn ol" onclick="cpAll()">Copy all</button><button class="btn ol" onclick="dl()">Download .txt</button></div><div class="card" style="margin-top:.9rem"><div class="lbl">Put it in Studio</div><div class="mut">Follow each arrow path. ServerScriptService gets a Script. StarterPlayerScripts and StarterGui get a LocalScript (the GUI one goes inside a ScreenGui). Press Play and watch Output. If something breaks, check the Output window in Studio.</div></div>`:`<div class="mut">No files yet.</div>`;
 else body=n?anatomy(g).map(a=>`<div class="part"><b>${a.n}</b><span>${a.f.length?"in "+a.f.map(esc).join(", "):esc(a.hint)}</span>${a.f.length?'<span class="chip ok" style="flex:0">found</span>':`<button class="btn sm" onclick="helper('${a.hint.replace(/'/g,"")}')">Ask Helper</button>`}</div>`).join("")+`<div class="mut" style="margin-top:6px">Detection is a keyword scan, not a guarantee.</div>`:`<div class="mut">Anatomy appears after the Coders finish.</div>`;
 return (g.err?`<div class="err">${esc(g.err)}</div>`:"")+`<div class="flow">${flow}</div><div class="stabs">${tabs}</div>`+body}
function render(){
 $("gtabs").innerHTML=GAMES.map(g=>`<div class="gt ${g===CUR?"on":""}" onclick="sel(${g.id})">${px("idea",g===CUR?"#e6b422":"#6a6a85")}${esc(g.name)}${g.running?" ...":""}</div>`).join("");
 const ae=document.activeElement,keep=ae&&ae.classList&&ae.classList.contains("myq");
 if(!keep)$("gview").innerHTML=CUR?view(CUR):`<div class="mut">Enter a theme above. Each game gets its own tab.</div>`;
 $("hlog").innerHTML=HP.st.map(s=>`<div class="step ${s[1]}"><i></i>${s[0]}</div>`).join("")+(HP.msg?`<div class="mut" style="margin-top:6px">${esc(HP.msg)}</div>`:"")}
const txt=g=>Object.entries(g.files).map(([p,c])=>`-- ===== ${p}.lua (${kind(p)}) =====\n${c}`).join("\n\n\n");
function cp(i){const p=Object.keys(CUR.files)[i];navigator.clipboard.writeText(CUR.files[p])}
function cpAll(){navigator.clipboard.writeText(txt(CUR))}
function dl(){const a=document.createElement("a");a.href="data:text/plain;charset=utf-8,"+encodeURIComponent(txt(CUR));a.download=CUR.name.replace(/\W+/g,"_")+".txt";a.click()}

(async()=>{try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({system:"Reply READY",messages:[{role:"user",content:"ping"}],max_tokens:5})});const d=await r.json().catch(()=>null);
 if(!r.ok||!d){$("ail").textContent="AI offline, check keys";$("aid").style.background="var(--rd)"}else $("ail").textContent="AI ready"}catch(e){$("ail").textContent="Cannot reach server";$("aid").style.background="var(--rd)"}})();
render();
</script></body></html>
